<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Estúdio Curtib.a</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
/* Estúdio interno: formulário à esquerda, prévia ao vivo à direita */
:root { --bg: #F1F2EE; --card: #FFFFFF; --line: #D9DDD6; --ink: #14231A; --muted: #55625A; --green: #1E4D33; --green-soft: #DCE8DF; --coral: #FF5B4A; --coral-ink: #C2321F;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; --sans: "DM Sans", ui-sans-serif, system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); }
header { background: var(--green); color: #fff; padding: 16px max(16px, env(safe-area-inset-left)); }
header .in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 800 26px/1 var(--display); letter-spacing: -.04em; }
.brand i { font-style: normal; color: var(--coral); }
header small { opacity: .8; }
main { max-width: 1120px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left)) 48px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } .preview { order: -1; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; }
.card h2 { margin: 0; font: 800 20px/1.2 var(--display); letter-spacing: -.02em; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 480px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
input[type=text], input[type=number], textarea { width: 100%; font: 400 15px/1.4 var(--sans); padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
input:focus, textarea:focus { outline: none; border-color: var(--green); }
.file { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.file input { font-size: 13px; max-width: 100%; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.stack { display: grid; gap: 16px; }
.preview { position: sticky; top: 16px; display: grid; gap: 12px; }
.preview canvas { width: 100%; height: auto; border-radius: 16px; background: #E9E1D3; display: block; }
.btns { display: grid; gap: 8px; }
button { font: 700 15px/20px var(--sans); border: 0; border-radius: 999px; padding: 13px 18px; cursor: pointer; }
.b-coral { background: var(--coral); color: var(--ink); }
.b-green { background: var(--green); color: #fff; }
.b-ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
button:disabled { opacity: .6; cursor: wait; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.total { font-size: 13px; color: var(--muted); }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
</style>
</head>
<body>
<header><div class="in"><span class="brand">curtib<i>.</i>a</span><small>Estúdio · uso interno</small></div></header>
<main>
  <div class="stack">
    <section class="card">
      <h2>Cliente</h2>
      <div class="grid2">
        <div><label for="cliente">Nome do cliente</label><input type="text" id="cliente" value="Cassi"></div>
        <div><label for="loja">Nome da empresa</label><input type="text" id="loja" value="Keli Moda e Estilo"></div>
      </div>
    </section>
    <section class="card">
      <h2>Espelho</h2>
      <div><label for="perfil">Nome no perfil (@)</label><input type="text" id="perfil" value="Keli_modaeestilo"></div>
      <div><label for="legenda">Legenda</label><input type="text" id="legenda" value="Moda real para mulheres reais" maxlength="80"></div>
      <div class="grid3">
        <div><label for="curtidas">Curtidas</label><input type="text" id="curtidas" value="2.847"></div>
        <div><label for="comentarios">Comentários</label><input type="text" id="comentarios" value="156"></div>
        <div><label for="reposts">Reposts</label><input type="text" id="reposts" value="42"></div>
      </div>
      <div><label for="logo">Logo do cliente</label><div class="file"><input type="file" id="logo" accept="image/*"></div></div>
      <div><label for="foto">Foto dentro do espelho</label><div class="file"><input type="file" id="foto" accept="image/*"></div><p class="hint">Sem foto escolhida, usa a foto de exemplo.</p></div>
      <label class="check"><input type="checkbox" id="parede" checked> Mostrar o espelho numa parede</label>
    </section>
    <section class="card">
      <h2>Proposta</h2>
      <div class="grid3">
        <div><label for="avista">À vista (R$)</label><input type="text" id="avista" value="600,00"></div>
        <div><label for="parcelas">Parcelas</label><input type="number" id="parcelas" value="12" min="1" max="24"></div>
        <div><label for="parcela">Valor da parcela (R$)</label><input type="text" id="parcela" value="57,08"></div>
      </div>
      <p class="total" id="total"></p>
      <div class="grid2">
        <div><label for="validade">Validade (dias)</label><input type="number" id="validade" value="15" min="1"></div>
        <div><label for="prazo">Prazo de entrega</label><input type="text" id="prazo" value="A combinar"></div>
      </div>
      <div><label for="obs">Observações</label><textarea id="obs" rows="2">Preço especial de lançamento para os primeiros clientes.</textarea></div>
    </section>
  </div>
  <aside class="preview">
    <canvas id="cv" width="1600" height="2600" aria-label="Prévia do espelho"></canvas>
    <div class="btns">
      <button type="button" class="b-coral" id="pdf">Baixar PDF da proposta</button>
      <button type="button" class="b-green" id="share">Enviar PDF (celular)</button>
      <button type="button" class="b-ghost" id="img">Baixar só a imagem</button>
    </div>
    <p class="hint" id="msg">Os dados ficam só neste aparelho. Nada é salvo no site.</p>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="mirror.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var logoUrl = null, fotoUrl = "foto-exemplo.jpg", current = null, timer = null;
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var num = function (s) { return parseFloat(String(s).replace(/\./g, "").replace(",", ".")) || 0; };
  function readFile(input, cb) {
    var f = input.files && input.files[0]; if (!f) return cb(null);
    var r = new FileReader(); r.onload = function () { cb(r.result); }; r.readAsDataURL(f);
  }
  $("logo").addEventListener("change", function () { readFile(this, function (u) { logoUrl = u; render(); }); });
  $("foto").addEventListener("change", function () { readFile(this, function (u) { fotoUrl = u || "foto-exemplo.jpg"; render(); }); });

  function data() {
    return { nome: $("perfil").value.trim() || "seu.negocio", legenda: $("legenda").value.trim(), curtidas: $("curtidas").value.trim() || "0",
      comentarios: $("comentarios").value.trim() || "0", reposts: $("reposts").value.trim() || "0", logo: logoUrl, foto: fotoUrl };
  }
  function render() {
    var n = parseInt($("parcelas").value, 10) || 1;
    $("total").textContent = "Total parcelado: R$ " + brl(n * num($("parcela").value));
    return CurtibaMirror.draw(data()).then(function (m) {
      current = $("parede").checked ? CurtibaMirror.wall(m) : m;
      var cv = $("cv"), ctx = cv.getContext("2d");
      cv.width = current.width; cv.height = current.height; ctx.drawImage(current, 0, 0);
      return current;
    });
  }
  document.querySelectorAll("input, textarea").forEach(function (el) {
    if (el.type === "file") return;
    el.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(render, 250); });
  });
  $("parede").addEventListener("change", render);

  function slug(s) { return (s || "cliente").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function makePdf() {
    var jsPDF = window.jspdf.jsPDF, doc = new jsPDF({ unit: "mm", format: "a4" });
    var green = [30, 77, 51], coral = [255, 91, 74], ink = [20, 35, 26], muted = [85, 98, 90], soft = [220, 232, 223];
    var loja = $("loja").value.trim() || "sua empresa", cliente = $("cliente").value.trim();
    var hoje = new Date(), val = new Date(hoje.getTime() + (parseInt($("validade").value, 10) || 15) * 864e5);
    var fmt = function (d) { return d.toLocaleDateString("pt-BR"); };
    // cabeçalho
    doc.setFillColor.apply(doc, green); doc.rect(0, 0, 210, 34, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(26); doc.setTextColor(255, 255, 255);
    doc.text("curtib", 18, 21); var w = doc.getTextWidth("curtib");
    doc.setTextColor.apply(doc, coral); doc.text(".", 18 + w, 21); var w2 = doc.getTextWidth(".");
    doc.setTextColor(255, 255, 255); doc.text("a", 18 + w + w2, 21);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.text("Proposta comercial", 192, 16, { align: "right" }); doc.text(fmt(hoje), 192, 22, { align: "right" });
    // título
    doc.setTextColor.apply(doc, ink); doc.setFont("helvetica", "bold"); doc.setFontSize(20);
    var tl = doc.splitTextToSize("Espelho personalizado para " + loja, 174); doc.text(tl, 18, 50);
    var y = 50 + tl.length * 8;
    if (cliente) { doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor.apply(doc, muted); doc.text("Preparado para " + cliente, 18, y); y += 4; }
    var top = y + 6;
    // imagem
    var iw = 78, ih = iw * current.height / current.width;
    if (ih > 168) { ih = 168; iw = ih * current.width / current.height; }
    doc.addImage(current.toDataURL("image/jpeg", 0.9), "JPEG", 18, top, iw, ih, undefined, "FAST");
    doc.setFontSize(8); doc.setTextColor.apply(doc, muted); doc.text("Prévia ilustrativa. Arte final aprovada antes da produção.", 18, top + ih + 5);
    // coluna direita
    var x = 104, cw = 88; y = top + 2;
    doc.setTextColor.apply(doc, ink); doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text("O que vem no seu espelho", x, y); y += 8;
    doc.setFont("helvetica", "normal"); doc.setFontSize(11);
    ["Espelho 60 × 120 cm em formato de celular", "LED embutido em luz quente", "Moldura com nome, logo e legenda da " + loja, "Kit de fixação na parede", "Produção em Curitiba"].forEach(function (t) {
      doc.setFillColor.apply(doc, coral); doc.circle(x + 1.3, y - 1.3, 1.1, "F");
      var l = doc.splitTextToSize(t, cw - 6); doc.text(l, x + 5, y); y += l.length * 5.4 + 1.6;
    });
    y += 4;
    var n = parseInt($("parcelas").value, 10) || 1, parc = num($("parcela").value), av = num($("avista").value);
    doc.setFillColor.apply(doc, soft); doc.roundedRect(x, y, cw, 44, 4, 4, "F");
    doc.setFontSize(9); doc.setFont("helvetica", "bold"); doc.setTextColor.apply(doc, green); doc.text("PREÇO ESPECIAL DE LANÇAMENTO", x + 6, y + 9);
    doc.setTextColor.apply(doc, ink); doc.setFontSize(22); doc.text("R$ " + brl(av), x + 6, y + 21);
    var wv = doc.getTextWidth("R$ " + brl(av));
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.text("à vista", x + 9 + wv, y + 21);
    doc.setFontSize(12); doc.text("ou " + n + "x de R$ " + brl(parc), x + 6, y + 31);
    doc.setFontSize(9); doc.setTextColor.apply(doc, muted); doc.text("Total parcelado: R$ " + brl(n * parc), x + 6, y + 38);
    y += 54;
    doc.setTextColor.apply(doc, ink); doc.setFontSize(11);
    doc.setFont("helvetica", "bold"); doc.text("Prazo de entrega: ", x, y); doc.setFont("helvetica", "normal"); doc.text($("prazo").value.trim() || "A combinar", x + doc.getTextWidth("Prazo de entrega: "), y); y += 6;
    doc.setFont("helvetica", "bold"); doc.text("Proposta válida até: ", x, y); doc.setFont("helvetica", "normal"); doc.text(fmt(val), x + doc.getTextWidth("Proposta válida até: "), y); y += 9;
    var obs = $("obs").value.trim();
    if (obs) { doc.setFontSize(10); doc.setTextColor.apply(doc, muted); doc.text(doc.splitTextToSize(obs, cw), x, y); }
    // rodapé
    doc.setDrawColor(217, 221, 214); doc.line(18, 272, 192, 272);
    doc.setFontSize(10); doc.setTextColor.apply(doc, ink); doc.setFont("helvetica", "bold"); doc.text("Curtib.a · Sua parede virou post", 18, 279);
    doc.setFont("helvetica", "normal"); doc.setTextColor.apply(doc, muted);
    doc.text("WhatsApp (41) 98757-4242 · curtiba.com.br · Curitiba, PR", 18, 285);
    return { doc: doc, name: "proposta-curtiba-" + slug(loja) + ".pdf" };
  }
  function busy(b, on) { ["pdf", "share", "img"].forEach(function (id) { $(id).disabled = on; }); }
  $("pdf").addEventListener("click", function () {
    busy(null, true); render().then(function () { var p = makePdf(); p.doc.save(p.name); $("msg").textContent = "PDF baixado: " + p.name; }).finally(function () { busy(null, false); });
  });
  $("share").addEventListener("click", function () {
    busy(null, true);
    render().then(function () {
      var p = makePdf(), file = new File([p.doc.output("blob")], p.name, { type: "application/pdf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: "Proposta Curtib.a" }).catch(function () {});
      }
      p.doc.save(p.name); $("msg").textContent = "Este navegador não envia arquivos direto. O PDF foi baixado: anexe no WhatsApp.";
    }).finally(function () { busy(null, false); });
  });
  $("img").addEventListener("click", function () {
    render().then(function (c) {
      var a = document.createElement("a"); a.href = c.toDataURL("image/jpeg", 0.92); a.download = "previa-curtiba-" + slug($("loja").value) + ".jpg"; a.click();
    });
  });
  render();
})();
</script>
</body>
</html>
